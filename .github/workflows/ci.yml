name: CI

# Validate every pull request targeting main and every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to match local development (see .nvmrc) for dev/CI parity.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly from package-lock.json and fails if the
        # lockfile is out of sync — reproducible installs, no surprises.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Only Chromium is needed (see playwright.config.ts); --with-deps pulls
        # the OS libraries the browser requires on the runner.
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # The Playwright config's `webServer` builds and serves the preview, so
        # no separate build/serve step is needed here.
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
